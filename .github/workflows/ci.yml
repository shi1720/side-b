name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: Types, module tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  firestore:
    name: Complete suite with isolated Firestore emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLOUD_PROJECT: demo-side-b-ci
      FIRESTORE_DATABASE_ID: side-b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --no-audit --no-fund
      - name: Run every test against a temporary database
        run: >-
          npx --yes firebase-tools@15.34.0 emulators:exec
          --only firestore --project demo-side-b-ci --non-interactive
          "npm test"
      - name: Save emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-emulator-diagnostics
          path: |
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: ignore
          retention-days: 7
